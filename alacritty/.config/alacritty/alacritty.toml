# ~/.config/alacritty/alacritty.toml
# Habamax Unified - Sjednocené šedé téma

[colors]
[colors.primary]
background     = "#1c1c1c"
foreground     = "#bcbcbc"
dim_foreground = "#808080"
bright_foreground = "#eeeeee"

[colors.cursor]
text   = "#1c1c1c"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text   = "#1c1c1c"
cursor = "#ffffff"

[colors.search.matches]
foreground = "#1c1c1c"
background = "#808080"

[colors.search.focused_match]
foreground = "#1c1c1c"
background = "#bcbcbc"

[colors.selection]
text       = "#1c1c1c"
background = "#585858"

[colors.normal]
black   = "#1c1c1c"
red     = "#af5f5f"
green   = "#5f875f"
yellow  = "#afaf5f"
blue    = "#5f87af"
magenta = "#af5faf"
cyan    = "#5fafaf"
white   = "#bcbcbc"

[colors.bright]
black = "#4d5960"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"

