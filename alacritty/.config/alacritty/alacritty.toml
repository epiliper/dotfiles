[font]
size = 20
normal = {family = "JetBrainsMono Nerd Font Mono", style = "Light"}
bold = {family = "JetBrainsMono Nerd Font Mono", style = "Light Bold"}
italic  = {family = "JetBrainsMono Nerd Font Mono", style = "Italic"}
# normal = { family = "BlexMono Nerd Font", style = "Light" }
# bold   = { family = "BlexMono Nerd Font", style = "Regular" }
# italic = { family = "BlexMono Nerd Font", style = "Light Italic Text" }
# bold_italic = { family = "BlexMono Nerd Font", style = "Italic Text" }
# size = 18
# normal = {family = "ComicShannsMono Nerd Font Mono", style = "Regular"}


[window]
decorations = "transparent"
dynamic_title = true
opacity = 1.0
blur = true
startup_mode = "Windowed"
# option_as_alt = "Both"


[window.dimensions]
columns = 120
lines = 36

[env]
TERM = 'xterm-256color'

[cursor]
blink_interval = 250

[cursor.style]
shape = "Block"
blinking = "Always"

[window.padding]
x = 30
y = 30
