# cyan = '0xa87322'
# white = '0xfdf4c1'

[font]
size = 16
normal = {family = "JetBrainsMono Nerd Font Mono", style = "Light"}
bold = {family = "JetBrainsMono Nerd Font Mono", style = "Light Bold"}
italic  = {family = "JetBrainsMono Nerd Font Mono", style = "Italic"}
# normal = { family = "BlexMono Nerd Font", style = "Light" }
# bold   = { family = "BlexMono Nerd Font", style = "Regular" }
# italic = { family = "BlexMono Nerd Font", style = "Light Italic Text" }
# bold_italic = { family = "BlexMono Nerd Font", style = "Italic Text" }
# size = 18
# normal = {family = "ComicShannsMono Nerd Font Mono", style = "Regular"}

# family = "TamzenForPowerline"
# style = "Medium"
# family = "AnonymicePro Nerd Font Mono"
# family = "Terminus"
# family = "GoMono Nerd Font"
# family = "Unifont"
# family = "IosevkaTerm Nerd Font Mono"
# family= "BlexMono Nerd Font Mono"

[window]
decorations = "transparent"
dynamic_title = true
opacity = 0.90
blur = true
startup_mode = "Windowed"
# option_as_alt = "Both"

[debug]
renderer = "glsl3"

[keyboard]
bindings = [
  { key = "H", mods = "Alt", chars = "\u001bh" },
  { key = "J", mods = "Alt", chars = "\u001bj" },
  { key = "K", mods = "Alt", chars = "\u001bk" },
  { key = "L", mods = "Alt", chars = "\u001bl" },
]

[window.dimensions]
columns = 120
lines = 36

[env]
TERM = 'xterm-256color'

[cursor]
blink_interval = 250

[cursor.style]
shape = "Block"
blinking = "Always"

[window.padding]
x = 30
y = 30
